# UNVERIFIED: this workflow has never run on GitHub. `npm run docs:build` was run by hand on macOS and the result
# served and walked in Chrome. Before the first run, enable Pages with "GitHub Actions" as the source. The site
# address (https://arnaudbletterer.github.io/nimbledeck/) is set in zensical.toml, and its path in website/build.mjs.
name: docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
