name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest deck (a few lines of Markdown) or the commands that show it.
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Where
      description: The slide or page, with the look, layout or component if you know it.
  - type: input
    id: env
    attributes:
      label: Browser, OS and Nimbledeck version or commit
    validations: { required: true }
