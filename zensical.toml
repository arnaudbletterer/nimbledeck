[project]
site_name = "Nimbledeck"
site_description = "Markdown slides that run things: animation, 3D, Python and video, on top of Slidev."
site_url = "https://arnaudbletterer.github.io/nimbledeck/"
# Staged from docs/ by website/build.mjs, which leaves out the contributor notes.
docs_dir = "site-src"
site_dir = "site"
extra_css = ["assets/site.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = "GETTING-STARTED.md" },
  { "Guide" = [
    { "Writing a deck" = "WRITING.md" },
    { "Layouts and playground" = "layouts.md" },
    { "Components gallery" = "components.md" },
    { "Themes and brands" = "THEMING.md" },
    { "Architecture" = "ARCHITECTURE.md" },
    { "Working offline" = "OFFLINE.md" },
    { "Performance" = "PERFORMANCE.md" },
  ] },
  { "Live demos" = "demos.md" },
  { "Run it locally" = "run-locally.md" },
]

[project.theme]
language = "en"
# System fonts only: the site must load with no connection (no Google Fonts).
font = false
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/layers"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/arnaudbletterer/nimbledeck"
name = "Nimbledeck on GitHub"


[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.tabbed.alternate_style = true
